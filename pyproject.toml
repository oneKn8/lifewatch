[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lifewatch"
version = "0.1.0"
description = "An accountability engine that notices when a declared commitment is not being kept, and escalates until it is kept or renegotiated."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lifewatch*", "packs*"]

# A pack is data as much as it is code, and the views are entirely data. Without
# these a wheel installs and then fails at runtime looking for pack.yaml, which
# is the worst shape of bug: it passes every test run from a source checkout.
[tool.setuptools.package-data]
"packs.school" = ["*.yaml"]
"lifewatch.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
