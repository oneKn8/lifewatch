[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lifewatch"
version = "0.1.0"
description = "An accountability engine that notices when a declared commitment is not being kept, and escalates until it is kept or renegotiated."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lifewatch*", "packs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
